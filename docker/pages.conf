server_tokens off;

# ── Port 8080 — site servi à la racine ───────────────────────────────────────
# Correspond à une page d'utilisateur ou d'organisation (`<compte>.github.io`)
# ou à un domaine personnalisé. C'est la configuration attendue par
# l'application : `start_url`, `scope` et le service worker valent « / ».
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    include /etc/nginx/pages-commun.conf;

    # nginx ne connaît pas toujours l'extension .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}

# ── Port 8081 — site servi sous /__REPO__/ ───────────────────────────────────
# Correspond à une page de projet (`<compte>.github.io/__REPO__/`). Le contenu
# est le même — un lien symbolique vers la racine du site —, seul le préfixe
# d'URL change. Sert à vérifier ce que devient l'application dans ce mode.
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /usr/share/nginx/projet;
    include /etc/nginx/pages-commun.conf;

    location = / {
        return 302 /__REPO__/;
    }

    location = /__REPO__/manifest.webmanifest {
        default_type application/manifest+json;
    }
}
