# Réglages communs aux deux modes de publication GitHub Pages.
#
# Ce qui est reproduit :
#   • site purement statique, aucun traitement côté serveur ;
#   • `index.html` comme index de répertoire, redirection 301 vers l'URL en « / » ;
#   • `404.html` du site s'il existe, sinon une page 404 générique ;
#   • aucun repli SPA vers `index.html` — c'est précisément pour cela que
#     l'application route dans le fragment (`#/office/date/section`) ;
#   • `Cache-Control: max-age=600` sur toutes les réponses, y compris les
#     fichiers hachés : Pages ne pose pas d'`immutable` ;
#   • `Access-Control-Allow-Origin: *` ;
#   • compression gzip, `ETag` et `Last-Modified`.
#
# Ce qui n'est pas reproduit : HTTPS et HTTP/2 (inutile ici, `localhost` est déjà
# un contexte sécurisé, service worker compris), les en-têtes propres à
# l'infrastructure GitHub, et le passage par Jekyll (voir `.nojekyll`).

index index.html;

charset utf-8;
# `text/html` est toujours inclus par nginx : le répéter déclencherait un avert-
# issement de type MIME dupliqué.
charset_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

absolute_redirect off;
port_in_redirect off;
autoindex off;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

add_header Cache-Control "max-age=600" always;
add_header Access-Control-Allow-Origin "*" always;

# Un répertoire sans index renvoie 404 chez Pages, là où nginx renverrait 403.
error_page 403 =404 @introuvable;
error_page 404 @introuvable;

location @introuvable {
    # La page 404 du site l'emporte ; sinon celle fournie par l'image.
    try_files /404.html /404-defaut.html =404;
}
