<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Fichier introuvable</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #f6f1e7;
        --encre: #241f18;
        --tenu: #8a8072;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #14110e;
          --encre: #e8dcc7;
          --tenu: #7d7160;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--fond);
        color: var(--encre);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.5rem;
        font-family: Georgia, "Times New Roman", serif;
      }
      p {
        margin: 0.25rem 0;
        color: var(--tenu);
      }
      code {
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Fichier introuvable.</p>
      <p>
        <small>
          Page 404 par défaut de la réplique locale. Un fichier
          <code>404.html</code> présent dans le site la remplacerait.
        </small>
      </p>
    </main>
  </body>
</html>
